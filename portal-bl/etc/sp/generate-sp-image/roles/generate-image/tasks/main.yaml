---
- name: Replace ADFS address with given address
  replace:
    path: "{{ item }}"
    regexp: "http://wlt-sts.leopoldiana.local/adfs/services/trust"
    replace: "{{targetADFS}}"
  with_items:
    - "../etc-shibboleth/shibboleth2.xml"

- name: Replace idptestbed with given SP name
  replace:
    path: "{{ item }}"
    regexp: "idptestbed"
    replace: "{{targetName}}"
  with_items:
    - "../etc-shibboleth/shibboleth2.xml"
    - "../var-www-html/sp-metadata.xml"
    - "../etc-httpd/conf.d/sp.conf"

- name: Replace uiurl with URL to UI
  replace:
    path: "{{ item }}"
    regexp: "uiurl"
    replace: "{{ uiUrl }}"
  with_items:
    - "../etc-httpd/conf.d/sp.conf"

- name: Create privatekey file
  copy:
    src: "{{files_path}}/private.pem"
    dest: "../sp_key"

- name: Create public cert  file
  copy:
    src: "{{files_path}}/public.pem"
    dest: "../etc-shibboleth/sp-cert.pem"

- name: Replace placeholder with key with given SP name
  replace:
    path: "../var-www-html/sp-metadata.xml"
    regexp: "PUBLIC_CERT_HERE"
    replace: "{{lookup('file', '{{files_path}}/public.pem') }}"

#kinda ugly but it works ;)
- name: Remove ----Begin/end certificate--- from sp-metadata.xml
  replace:
    path: "../var-www-html/sp-metadata.xml"
    regexp: "-----.+CERTIFICATE-----\n"
    replace: ""

- name: Replace placeholder in key with given SP name
  replace:
    path: "../var-www-html/sp-metadata.xml"
    regexp: "SP_NAME_HERE"
    replace: "{{targetName}}"

- name: Set correct idp-metadata file
  copy:
    src: "{{idp_metadata_path}}"
    dest: "../etc-shibboleth/idp-metadata.xml"

- name: Build docker image
  docker_image:
    build:
      path: ".."
    name:  "{{registryPath}}{{imageName}}:{{imageTag}}"
    tag: "{{imageTag}}"
    push: yes
    source: build