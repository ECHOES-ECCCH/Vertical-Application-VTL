metadata:
  labels:
    io.kompose.service: ocr-training-service
  name: ocr-training-service
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    io.kompose.service: ocr-training-service
  strategy:
    activeDeadlineSeconds: 21600
    recreateParams:
      timeoutSeconds: 600
    resources: {}
    rollingParams:
      intervalSeconds: 1
      maxSurge: 25%
      maxUnavailable: 25%
      timeoutSeconds: 600
      updatePeriodSeconds: 1
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: ocr-training-service
    spec:
      containers:
      - env:
        - name: IIIF_SERVER_ENDPOINT
          value: http://iiif-server:8080
        - name: OCR_TRAIN_DB_HOST
          value: ocr-training-db
        - name: OCR_TRAIN_DB_PASS
          value: vtl_ocr_pass
        - name: OCR_TRAIN_DB_PORT
          value: "5432"
        - name: OCR_TRAIN_DB_USER
          value: vtl_ocr_user
        - name: SPRING_ACTIVE_PROFILE
          value: dev
        - name: OCR_TRAIN_DB_NAME
          value: vtl_ocr_training
        - name: OCR_TOOLS_ENDPOINT
          value: http://ocr-tools:5557
        image: null
        imagePullPolicy: IfNotPresent
        name: wlt-ocr-training-service
        ports:
        - containerPort: 5558
          protocol: TCP
        - containerPort: 9995
          protocol: TCP
        resources:
          limits:
            cpu: 600m
            memory: 600Mi
          requests:
            cpu: 200m
            memory: 200Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/vtl/training-data
          name: vtl-ocr-training-tess-data
          subPath: data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: vtl-ocr-training-tess-data
        persistentVolumeClaim:
          claimName: vtl-ocr-training-tess-data
  test: false
  triggers:
  - type: ConfigChange
  - imageChangeParams:
      automatic: true
      containerNames:
      - wlt-ocr-training-service
      from:
        kind: ImageStreamTag
        name: ocr-training-service:latest
    type: ImageChange
