apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  labels:
    io.kompose.service: wlt-portal-bl
  name: wlt-portal-bl
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    io.kompose.service: wlt-portal-bl
  strategy:
    activeDeadlineSeconds: 21600
    recreateParams:
      timeoutSeconds: 600
    resources: {}
    rollingParams:
      intervalSeconds: 1
      maxSurge: 25%
      maxUnavailable: 25%
      timeoutSeconds: 600
      updatePeriodSeconds: 1
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: wlt-portal-bl
    spec:
      containers:
      - envFrom:
          - configMapRef:
              name: wlt-portal-bl-config
        image: null
        imagePullPolicy: IfNotPresent
        name: wlt-portal-bl
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 9998
          protocol: TCP
        - containerPort: 9010
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/healthcheck/start-state
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 200Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
  test: false
  triggers:
  - type: ConfigChange
  - imageChangeParams:
      automatic: true
      containerNames:
      - wlt-portal-bl
      from:
        kind: ImageStreamTag
        name: wlt-portal-bl:latest
    type: ImageChange
---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: wlt-portal-ui
  labels:
    io.kompose.service: wlt-portal-ui
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    app: wlt-portal-ui
    deploymentconfig: wlt-portal-ui
  strategy:
    activeDeadlineSeconds: 21600
    resources: {}
    rollingParams:
      intervalSeconds: 1
      maxSurge: 25%
      maxUnavailable: 25%
      timeoutSeconds: 600
      updatePeriodSeconds: 1
    type: Rolling
  template:
    metadata:
      labels:
        app: wlt-portal-ui
        deploymentconfig: wlt-portal-ui
    spec:
      containers:
      - image: null
        imagePullPolicy: Always
        name: wlt-portal-ui
        ports:
        - containerPort: 80
          protocol: TCP
        - containerPort: 8080
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /usr/share/nginx/html/config
          name: volume-ttrlw
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: wlt-portal-ui-config
        name: volume-ttrlw
  test: false
  triggers:
  - type: ConfigChange
  - imageChangeParams:
      automatic: true
      containerNames:
      - wlt-portal-ui
      from:
        kind: ImageStreamTag
        name: wlt-portal-ui:latest
    type: ImageChange
---
