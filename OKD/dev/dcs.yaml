apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: pgadmin4
  labels:
    io.kompose.service: pgadmin4
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    deploymentconfig: pgadmin4
  strategy:
    activeDeadlineSeconds: 21600
    recreateParams:
      timeoutSeconds: 600
    resources: {}
    type: Recreate
  template:
    metadata:
      labels:
        deploymentconfig: pgadmin4
    spec:
      containers:
      - env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: admin@bsa.pcss.pl
        - name: PGADMIN_DEFAULT_PASSWORD
          value: wlt-bl-password
        image: null
        imagePullPolicy: Always
        name: pgadmin4
        ports:
        - containerPort: 80
          protocol: TCP
        - containerPort: 443
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/pgadmin
          name: pgadmin
          subPath: data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: pgadmin
        persistentVolumeClaim:
          claimName: pgadmin
  test: false
  triggers:
  - imageChangeParams:
      automatic: true
      containerNames:
      - pgadmin4
      from:
        kind: ImageStreamTag
        name: pgadmin4:latest
    type: ImageChange
  - type: ConfigChange
---
