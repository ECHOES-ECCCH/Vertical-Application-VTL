  template:
    metadata:
      labels:
        io.kompose.service: ocr-tools
    spec:
      containers:
      - env:
        - name: OCR_TRAINING_ENDPOINT
          value: http://ocr-training-service:5558
        - name: SPRING_ACTIVE_PROFILE
          value: dev
        - name: JAVA_OPTS
          value: -Xms128m -Xmx3000m
        image: null
        imagePullPolicy: IfNotPresent
