apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    volume.beta.kubernetes.io/storage-class: standard
    volume.beta.kubernetes.io/storage-provisioner: kubernetes.io/cinder
  finalizers:
  - kubernetes.io/pvc-protection
  name: pgadmin
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    volume.beta.kubernetes.io/storage-class: gold
    volume.beta.kubernetes.io/storage-provisioner: kubernetes.io/cinder
  finalizers:
  - kubernetes.io/pvc-protection
  name: bad-postgresql-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    volume.beta.kubernetes.io/storage-class: manila-share
    volume.beta.kubernetes.io/storage-provisioner: externalstorage.k8s.io/manila
  finalizers:
  - kubernetes.io/pvc-protection
  labels:
    io.kompose.service: vtl-ocr-training-db-data
  name: vtl-ocr-training-db-data
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    volume.beta.kubernetes.io/storage-class: manila-share
