databaseChangeLog:
    - changeSet:
          id: 00001-WLT_233-1
          author: swolarz
          comment: Create table for pending OCR corrections
          changes:
              - createTable:
                    tableName: pending_ocr_corrections
                    columns:
                        - column:
                              name: id
                              type: bigint
                              autoIncrement: true
                              constraints:
                                  primaryKey: true
                                  nullable: false
                        - column:
                              name: iiif_image_url
                              type: varchar(255)
                              constraints:
                                  unique: true
                                  nullable: false
                        - column:
                              name: correct_text
                              type: text
                              constraints:
                                  nullable: false
                        - column:
                              name: image_format
                              type: varchar(32)
                              constraints:
                                  nullable: false
                        - column:
                              name: fetch_retries_num
                              type: integer
                              constraints:
                                  nullable: false
