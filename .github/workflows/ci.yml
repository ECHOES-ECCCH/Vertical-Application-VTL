name: Tests and container images

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR checks
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-tests:
    name: Java tests (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [iiif-tools, ocr-tools]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: '${{ matrix.module }}/pom.xml'
      - name: Run unit tests
        working-directory: ${{ matrix.module }}
        run: mvn --batch-mode --no-transfer-progress test

  images:
    name: Image (${{ matrix.module }})
    # Every module in the test matrix must pass before any image is built
    needs: java-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        module: [portal-bl, portal-ui, iiif-tools, ocr-tools, ocr-training, postgresql]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # normalize image name to lowercase
          images: ghcr.io/${{ github.repository }}/${{ matrix.module }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.module }}
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
      - name: Record published image digest
        if: github.ref == 'refs/heads/master'
        env:
          MODULE: ${{ matrix.module }}
          TAGGED_IMAGE: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          IMAGE_NAME="${TAGGED_IMAGE%:*}"
          {
            echo "### ${MODULE}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tag: \`${TAGGED_IMAGE}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Immutable-content reference: \`${IMAGE_NAME}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
